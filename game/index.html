<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOIDSTRIKE — hold the gate</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #02030a; }
  #game {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    display: block; touch-action: none; cursor: crosshair; background: #05060e;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800" aria-label="VOIDSTRIKE: a twin-stick arena shooter. Move with WASD, aim with the mouse, hold click to fire, dash with Shift."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
